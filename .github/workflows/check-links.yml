name: Check links

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'README.md'
      - 'check-links.sh'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every link in README.md
        run: ./check-links.sh
